services:
  coralink:
    build:
      context: ./server
    container_name: coralink-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: production
      PORT: "8080"
      DB_PATH: /data/coralink.db
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      AUTH_PEPPER: ${AUTH_PEPPER:?set AUTH_PEPPER}
      DEV_MODE: "false"
      MESSAGE_TTL_DAYS: "7"
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://app.coralink.example.com}
      LOG_LEVEL: info
    volumes:
      - coralink-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  coralink-data:

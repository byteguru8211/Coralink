name: coralink
description: "Coralink — grow your conversations. E2EE peer-to-peer messenger."
publish_to: 'none'
version: 1.1.0+4002

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  flutter_webrtc: ^1.6.3
  sqflite_sqlcipher: ^3.4.1
  sqflite_common: ^2.5.14
  sqflite_common_ffi: ^2.4.5
  flutter_secure_storage: ^11.2.0
  libsignal_protocol_dart: ^0.8.2
  web_socket_channel: ^3.0.3
  cryptography: ^2.9.0
  flutter_animate: ^4.5.2
  intl: 0.20.2
  uuid: ^4.6.0
  audioplayers: ^6.8.1
  flutter_local_notifications: ^22.3.3
  image_picker: ^1.2.4
  permission_handler: 12.0.3
  path_provider: ^2.1.6
  path: ^1.9.1
  shared_preferences: ^2.5.6
  http: ^1.6.0
  mime: ^2.1.0
  collection: ^1.19.1
  file_picker: ^13.4.0
  record: ^7.2.0
  video_player: ^2.11.1
  window_manager: ^0.5.2
  tray_manager: ^0.5.3
  camera: ^0.12.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/images/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Light.ttf
          weight: 300
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 26
  adaptive_icon_background: "#0D2E1F"
  adaptive_icon_foreground: "assets/images/app_icon_foreground.png"
  windows:
    generate: true
    image_path: "assets/images/app_icon.png"
    icon_size: 256
  web:
    generate: true
    image_path: "assets/images/app_icon.png"
    background_color: "#0D2E1F"
    theme_color: "#1A9C7A"
